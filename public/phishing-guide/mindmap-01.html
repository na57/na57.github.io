<script>
const NS = 'http://www.w3.org/2000/svg';
const branches = [
  { id:'intro', side:'left', title:'课程导论 · 先把主线看清', color:'#1d5f9e', items:[
    {h:'这门课练什么', d:'面向全校师生。会三件事：看懂邮件要你做什么、在关键处停下核实、判断不了走正确下一步；不背破绽、不当专家、不讲攻防。'},

    {h:'八讲分三组', d:'①认识这条链（1–2）；②四个检查点（3–6）；③从判断到动作（7–8）。'},
    {h:'一条主线骨架', d:'伪装身份 → 制造触发 → 诱导动作 → 骗取凭据；四个检查点：谁发的、说什么、点哪里、开什么；收尾是换通道核实与按流程上报。'},
    {h:'怎么用这套课', d:'讲义看案例 → 课件抓主线 → 暂停演练真的停 → 合上页面自己复述；进度只存本机浏览器。'}
  ]},
  { id:'chain', side:'left', title:'上当地图 · 六环到失守', color:'#c4651f', items:[
    {h:'六环因果链', d:'①邮件到达 → ②显示名声称学校部门 → ③制造紧急或利益 → ④情绪压过怀疑 → ⑤按下链接或打开附件 → ⑥账号或信息失守。'},
    {h:'颜色标记', d:'橙色是情绪触发点（第③环），红色是失守终点（第⑥环）。骗子不攻系统，攻的是「先行动、后思考」的反射。'},
    {h:'转折点在第④环', d:'从问「这是真的吗」变成问「怎么快点弄好」——情绪正式压过怀疑，这才是要拦的那一刻。'},
    {h:'刹车位置', d:'在第④环之前插一句：先停六秒，换一条通道确认。打断这一下，后面整条链就断了。'}
  ]},
  { id:'cases', side:'left', title:'两个案例 · 同一套结构', color:'#b03a2e', items:[
    {h:'案例一｜冻结通知', d:'显示名「信息技术部」、主题「异地登录风险」、正文「24 小时后冻结」、链接文字「系统验证」指向非校内域名 phishsim.cacter.com。权威＋紧急，没有错别字。'},
    {h:'案例二｜奖助学金', d:'「今日内确认收款账户，逾期视为放弃」——把怕换成贪，结构完全相同。'},
    {h:'「我没钱没权限」是错觉', d:'骗子要的是账号本身：拿你的通讯录群发、冒充你向亲友要钱、把你的电脑当跳板。别用自己的身家衡量值不值得被骗。'},
    {h:'暂停演练的答案', d:'要你点「系统验证」；按的是权威＋紧急；正确动作是不在信里点，改走官方入口，并向信息技术中心上报。'}
  ]},
  { id:'mo', side:'left', title:'「陌」字 · 提示不是判决', color:'#8b5a9f', items:[
    {h:'它到底表示什么', d:'陌生来信提示。系统把你的注意力叫醒，但不替你下结论。'},
    {h:'三种想错', d:'①带陌就是钓鱼（正常外校学术邮件也带）；②没陌就放心点（熟人邮箱被盗也不带陌）；③陌是因错别字标注（它只看发件人是否陌生）。'},
    {h:'正确姿势', d:'看到陌就多看一眼 → 展开真实地址核对域名 → 拿不准换通道核实。第 3 讲专门教怎么核。'}
  ]},
  { id:'task', side:'right', title:'本讲任务 · 认出三种本能', color:'#2b7a78', items:[
    {h:'本讲要回答', d:'钓鱼邮件骗的不是技术，是哪几种本能？先把那封本校演练邮件放进你手里，看当时到底怎么想的。'},
    {h:'学完能做到', d:'说出三类触发各利用了什么心理；复述演练邮件经过并指出情绪压过判断那一刻；解释「我没钱没权限骗我没用」为何是错觉。'},
    {h:'在八讲中的位置', d:'本讲只解决「为什么想点」；第 2 讲把它展开成六步链「怎么走的」；第 3 讲进入第一个检查点「谁发的」。'}
  ]},
  { id:'instinct', side:'right', title:'三种本能 · 骗子按的按钮', color:'#33735a', items:[
    {h:'权威：信权威', d:'服从老师、领导、官方部门；常见说法是「信息技术部」「教务处」「学院领导」。'},
    {h:'紧急：怕出事、怕错过', d:'限时限刻、即将停用、今天最后一天；例如「24 小时后冻结」，让你来不及想就先动手。'},
    {h:'利诱与恐惧：贪好处、怕坏结果', d:'奖助学金、成绩、工资条、账号冻结；要么是好处怕你不要，要么是坏结果怕你摊上。'},
    {h:'三者常叠加', d:'权威＋紧急是最狠的组合拳：名字给你信任，时限给你压力。看邮件时就认它按的是哪一根弦。'}
  ]},
  { id:'action', side:'right', title:'核心机制 · 把信号变成动作', color:'#8a5a2b', items:[
    {h:'破绽会过期，动作不会', d:'错别字、排版、固定话术会随 AI 和手法更新而失效；先停六秒、不在信里动作、换通道核实、拿不准上报——与邮件长相无关。'},
    {h:'身上的第一个信号', d:'心里咯噔一下、急着想点又有点犹豫、不想让别人知道。它比任何破绽都早，出现就该启动动作。'},
    {h:'固定三步动作', d:'①先停六秒，不立刻回；②离开这封信，从官方入口或电话核实，绝不在信里完成它要求的动作；③拿不准就上报信息技术中心。核实通道必须独立于这封邮件。'}
  ]},
  { id:'review', side:'right', title:'复习与衔接 · 合上页面自测', color:'#5c554b', items:[
    {h:'三句话小结', d:'解决什么：认出三种本能并指出那一刻；核心机制：骗子攻反射，破绽过期动作不过期；承上启下：交给第 2 讲拆六步链。'},
    {h:'四项毕业挑战', d:'①三种本能各举本校场景；②复述邮件经过并指出转折点；③解释「没钱骗我没用」为何是错觉；④写出第一个信号和三个应对动作。'},
    {h:'下一讲预告', d:'第 2 讲：把这次上当拆成一条六步攻击链——伪装、投递、触发、诱导、收集、利用，看每步骗子在赌什么、你在哪能刹车。'}
  ]}
];

const collapsed = new Set();
const W = 2000;
const ROOT_W = 380, ROOT_H = 116;
const HEAD_W = 220, HEAD_H = 48;
const LEAF_W = 380, LEAF_GAP = 10, BRANCH_GAP = 26;
const X = { root:810, lHead:480, lLeaf:60, rHead:1300, rLeaf:1560 };
const TITLE_PAD = 14, TITLE_BASE = 30, DETAIL_BASE = 52, DETAIL_LH = 19.5;
const $ = id => document.getElementById(id);

function units(s){
  let n=0;
  for(const ch of String(s)) n += /[\x00-\xff]/.test(ch) ? .55 : 1;
  return n;
}
function wrap(text, maxU){
  const out=[]; let line='', w=0;
  for(const ch of String(text)){
    const cw=units(ch);
    if(w+cw>maxU && line){ out.push(line); line=''; w=0; }
    line+=ch; w+=cw;
  }
  if(line) out.push(line);
  return out;
}
function leafHeight(it){
  const ds = it.d ? wrap(it.d, (LEAF_W-2*TITLE_PAD-8)/13.5) : [];
  return ds.length ? DETAIL_BASE + (ds.length-1)*DETAIL_LH + 10 : TITLE_BASE+14;
}
function branchHeight(b){
  if(collapsed.has(b.id)) return HEAD_H;
  const sum = b.items.reduce((a,it)=>a+leafHeight(it),0) + LEAF_GAP*(b.items.length-1);
  return Math.max(HEAD_H, sum);
}
function el(name, attrs={}){
  const n=document.createElementNS(NS,name);
  for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
  return n;
}
function addText(parent, x, y, text, attrs){
  const t=el('text',Object.assign({x,y},attrs||{}));
  t.textContent=text; parent.appendChild(t); return t;
}
function path(parent, d, color, width){
  parent.appendChild(el('path',{d,fill:'none',stroke:color,'stroke-width':width||2.4,'stroke-linecap':'round',opacity:.55}));
}

function render(){
  const svg=$('map');
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  const sides={left:branches.filter(b=>b.side==='left'), right:branches.filter(b=>b.side==='right')};
  const totals={};
  for(const s of ['left','right']) totals[s]=sides[s].reduce((a,b)=>a+branchHeight(b),0)+BRANCH_GAP*(sides[s].length-1);
  const H=Math.max(1010, Math.max(totals.left,totals.right)+190);
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const cy=H/2;

  // 背景装饰
  const defs=el('defs');
  const grad=el('linearGradient',{id:'rootGrad',x1:'0',y1:'0',x2:'1',y2:'1'});
  grad.appendChild(el('stop',{offset:'0','stop-color':'#245f94'}));
  grad.appendChild(el('stop',{offset:'1','stop-color':'#123f6a'}));
  defs.appendChild(grad);
  const glow=el('radialGradient',{id:'glow'});
  glow.appendChild(el('stop',{offset:'0','stop-color':'#dce9f6','stop-opacity':'.85'}));
  glow.appendChild(el('stop',{offset:'1','stop-color':'#dce9f6','stop-opacity':'0'}));
  defs.appendChild(glow);
  svg.appendChild(defs);
  svg.appendChild(el('ellipse',{cx:1000,cy:cy,rx:520,ry:Math.min(560,H*.42),fill:'url(#glow)'}));

  // 布局
  const placed={};
  for(const s of ['left','right']){
    let y=cy-totals[s]/2;
    for(const b of sides[s]){
      const bh=branchHeight(b);
      placed[b.id]={ y, h:bh, headY:y+(bh-HEAD_H)/2, leaves:[] };
      let ly=y;
      for(const it of b.items){
        const lh=leafHeight(it);
        placed[b.id].leaves.push({item:it,y:ly,h:lh});
        ly+=lh+LEAF_GAP;
      }
      y+=bh+BRANCH_GAP;
    }
  }

  const connectors=el('g',{id:'connectors'});
  svg.appendChild(connectors);

  // 连线：中心 → 分支标题
  for(const b of branches){
    const p=placed[b.id], hc=p.headY+HEAD_H/2;
    if(b.side==='left') path(connectors,`M ${X.root} ${cy} C ${X.root-80} ${cy}, ${X.lHead+HEAD_W+80} ${hc}, ${X.lHead+HEAD_W} ${hc}`,b.color,3);
    else path(connectors,`M ${X.root+ROOT_W} ${cy} C ${X.root+ROOT_W+80} ${cy}, ${X.rHead-80} ${hc}, ${X.rHead} ${hc}`,b.color,3);
    if(!collapsed.has(b.id)){
      for(const lf of p.leaves){
        const lc=lf.y+lf.h/2;
        if(b.side==='left') path(connectors,`M ${X.lHead} ${hc} C ${X.lHead-60} ${hc}, ${X.lLeaf+LEAF_W+60} ${lc}, ${X.lLeaf+LEAF_W} ${lc}`,b.color,2);
        else path(connectors,`M ${X.rHead+HEAD_W} ${hc} C ${X.rHead+HEAD_W+60} ${hc}, ${X.rLeaf-60} ${lc}, ${X.rLeaf} ${lc}`,b.color,2);
      }
    }
  }

  // 中心节点
  const root=el('g',{});
  root.appendChild(el('rect',{x:X.root,y:cy-ROOT_H/2,width:ROOT_W,height:ROOT_H,rx:24,fill:'url(#rootGrad)',stroke:'#0d3457','stroke-width':2}));
  addText(root,X.root+ROOT_W/2,cy-16,'为什么会上当',{'text-anchor':'middle','font-size':'27','font-weight':'700',fill:'#fff'});
  addText(root,X.root+ROOT_W/2,cy+16,'第 1 讲 · 骗的不是技术，是本能',{'text-anchor':'middle','font-size':'15',fill:'#dbe8f4'});
  addText(root,X.root+ROOT_W/2,cy+40,'看到催你点的 → 先停六秒 → 换通道核实',{'text-anchor':'middle','font-size':'13',fill:'#b9d3ea'});
  svg.appendChild(root);

  // 分支与叶片
  for(const b of branches){
    const p=placed[b.id];
    const hx=b.side==='left'?X.lHead:X.rHead;
    const g=el('g',{'data-branch':b.id});
    const hg=el('g',{class:'branch-head',role:'button','aria-label':(collapsed.has(b.id)?'展开 ':'折叠 ')+b.title});
    hg.appendChild(el('rect',{class:'bhead-rect',x:hx,y:p.headY,width:HEAD_W,height:HEAD_H,rx:12,fill:b.color,stroke:b.color,'stroke-width':1}));
    addText(hg,hx+HEAD_W/2,p.headY+30,b.title,{'text-anchor':'middle','font-size':'16.5','font-weight':'700',fill:'#fff'});
    addText(hg,hx+HEAD_W/2,p.headY+43,collapsed.has(b.id)?'＋ 点击展开':'－ 点击折叠',{'text-anchor':'middle','font-size':'11',fill:'rgba(255,255,255,.82)'});
    hg.addEventListener('click',()=>{ collapsed.has(b.id)?collapsed.delete(b.id):collapsed.add(b.id); render(); });
    g.appendChild(hg);

    if(!collapsed.has(b.id)){
      const lx=b.side==='left'?X.lLeaf:X.rLeaf;
      for(const lf of p.leaves){
        const lg=el('g',{class:'leaf'});
        lg.appendChild(el('rect',{x:lx,y:lf.y,width:LEAF_W,height:lf.h,rx:11,fill:'#fff',stroke:b.color,'stroke-opacity':'.38','stroke-width':1.4}));
        lg.appendChild(el('rect',{x:lx,y:lf.y+8,width:4,height:lf.h-16,rx:2,fill:b.color}));
        addText(lg,lx+TITLE_PAD+6,lf.y+TITLE_BASE,lf.item.h,{'font-size':'16','font-weight':'700',fill:b.color});
        if(lf.item.d){
          wrap(lf.item.d,(LEAF_W-2*TITLE_PAD-8)/13.5).forEach((line,i)=>{
            addText(lg,lx+TITLE_PAD+6,lf.y+DETAIL_BASE+i*DETAIL_LH,line,{'font-size':'13.5',fill:'#4c463e'});
          });
        }
        g.appendChild(lg);
      }
    }
    svg.appendChild(g);
  }
}

$('expandAll').addEventListener('click',()=>{collapsed.clear();render();});
$('collapseAll').addEventListener('click',()=>{branches.forEach(b=>collapsed.add(b.id));render();});
$('printBtn').addEventListener('click',()=>window.print());
render();
</script>
